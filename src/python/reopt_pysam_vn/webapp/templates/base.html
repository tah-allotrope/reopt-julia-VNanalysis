<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vietnam DPPA Deal Screener{% endblock %}</title>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js" charset="utf-8"></script>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #0b0d10; color: #e6e6e6; }
    @media (prefers-color-scheme: light) { body { background: #f7f7f8; color: #1a1a1a; } }
    header { padding: 1rem 1.5rem; border-bottom: 1px solid rgba(128,128,128,0.25); display: flex; gap: 1.5rem; align-items: center; }
    header a { color: inherit; text-decoration: none; font-weight: 600; }
    main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid rgba(128,128,128,0.2); }
    .card { border: 1px solid rgba(128,128,128,0.25); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.75rem; }
    .metric { border: 1px solid rgba(128,128,128,0.25); border-radius: 8px; padding: 0.75rem; }
    .metric .label { font-size: 0.8rem; opacity: 0.7; }
    .metric .value { font-size: 1.3rem; font-weight: 600; }
    .status-badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.8rem; }
    .status-done { background: #1f6b3a; color: #d7ffe6; }
    .status-error { background: #6b1f1f; color: #ffd7d7; }
    .status-solving, .status-analyzing, .status-queued { background: #6b5a1f; color: #fff3d7; }
    input, select, button, textarea { font: inherit; padding: 0.4rem 0.6rem; border-radius: 6px; border: 1px solid rgba(128,128,128,0.4); background: transparent; color: inherit; }
    form section { margin-bottom: 1.25rem; }
    label { display: block; margin-bottom: 0.25rem; font-size: 0.9rem; }
    .field { margin-bottom: 0.6rem; }
    .readonly-defaults { opacity: 0.6; font-size: 0.85rem; }
    a.button, button { cursor: pointer; }
    #site-map, #context-map { width: 100%; height: 100%; min-height: 280px; }
    .map-hint { font-size: 0.85rem; opacity: 0.8; margin: 0.25rem 0 0.5rem; }
    .map-search { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
    .map-search input { flex: 1; }
    .map-search-msg { font-size: 0.85rem; color: #ff8080; min-height: 1.2rem; }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header>
    <a href="/">Vietnam DPPA Deal Screener</a>
    <a href="/deals/new">New deal</a>
    <a href="/runs">Run history</a>
    <a href="/compare">Compare</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
