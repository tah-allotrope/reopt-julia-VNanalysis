[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reopt-pysam-vn"
version = "0.1.0"
description = "Vietnam REopt and PySAM toolkit for buyer-side optimization and developer-side finance modeling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "nrel-pysam>=7.1",
  "numpy-financial>=1.0",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
webapp = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.setuptools.package-data]
"reopt_pysam_vn" = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = [
  "src/python",
]
testpaths = [
  "tests",
]
markers = [
  "network: makes real HTTP calls to external services; excluded in CI",
  "requires_artifacts: reads git-ignored machine-local files under artifacts/; excluded in CI",
  "golden_machine: bit-exact golden comparison only valid on the primary dev machine's resources; excluded in CI",
  "requires_julia: shells out to a local Julia subprocess; CI has no Julia install step; excluded in CI",
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["reopt_pysam_vn.analysis.*", "reopt_pysam_vn.webapp.*"]
disallow_untyped_defs = true
