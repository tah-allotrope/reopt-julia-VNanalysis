name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[webapp]" mypy pytest pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check src scripts tests

      - name: Type check (analysis + webapp public API surfaces)
        run: mypy src/python/reopt_pysam_vn/analysis src/python/reopt_pysam_vn/webapp

      - name: Test (portable suite)
        run: python -m pytest tests/python -m "not network and not requires_artifacts and not golden_machine and not requires_julia" -q --cov=reopt_pysam_vn --cov-report=term-missing
        env:
          PYTHONPATH: ""
