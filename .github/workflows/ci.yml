name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[webapp]" mypy pytest

      # NOTE: a `ruff check` step is intentionally NOT included yet. ruff has no
      # `[tool.ruff]` configuration in pyproject.toml and currently reports 181
      # pre-existing lint violations plus a hard parse error on a malformed glob
      # in .gitignore (`ceba-review/*[repo-checked].pptx`). Configuring ruff and
      # cleaning up that backlog is scoped to the separate repo hygiene/CI plan
      # (research/2026-07-11-reopt-pysam-next-level-brainstorm.md PHASE-02) —
      # add the ruff step here once that lands, rather than shipping a
      # known-red lint gate now.
      - name: Type check (analysis + webapp public API surfaces)
        run: mypy src/python/reopt_pysam_vn/analysis src/python/reopt_pysam_vn/webapp

      - name: Test (non-network suite)
        run: python -m pytest tests/python -m "not network" -q
        env:
          PYTHONPATH: ""
